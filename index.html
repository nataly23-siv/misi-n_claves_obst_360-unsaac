<div id="wrap"><button id="snd" onclick="toggleSnd()" title="Sonido (M)">🔊</button><canvas id="c" width="640" height="420"></canvas><div id="dlg"></div></div>
<script>
/* ============ PROTOCOLO CONFIGURABLE ============
 EJEMPLO GENÉRICO: reemplazar por el protocolo de tu curso/institución.
 paso: {txt, item:'id de material' | accion:'id de acción junto a la paciente', req:true si necesita al equipo presente} */
const PROTOCOLO={
 R:{nombre:'Clave Roja',color:'#e53935',signos:'Sangrado vaginal abundante tras el parto, útero blando, palidez, PA 80/50, FC 125.',
  pasos:[{txt:'Vía venosa y fluidos',item:'via'},{txt:'Medicamento uterotónico',item:'oxi',req:true},{txt:'Masaje uterino',accion:'masaje'},{txt:'Hemoderivados',item:'gr',req:true}]},
 A:{nombre:'Clave Azul',color:'#1e88e5',signos:'PA 170/115, cefalea intensa, visión borrosa, hiperreflexia, edemas.',
  pasos:[{txt:'Vía venosa',item:'via'},{txt:'Anticonvulsivante',item:'mg',req:true},{txt:'Antihipertensivo',item:'aht',req:true},{txt:'Control de signos vitales',accion:'signos'}]},
 Y:{nombre:'Clave Amarilla',color:'#f9a825',signos:'Fiebre 39 °C, escalofríos, FC 130, hipotensión, flujo vaginal fétido.',
  pasos:[{txt:'Toma de muestras (cultivos)',item:'hemo'},{txt:'Vía venosa y fluidos',item:'via'},{txt:'Antibiótico',item:'atb',req:true},{txt:'Control de signos vitales',accion:'signos'}]}};
const ITEMS={via:['Vía + fluidos','💧','enf'],oxi:['Uterotónico','💉','far'],mg:['Anticonvulsivante','🧪','far'],aht:['Antihipertensivo','💊','far'],atb:['Antibiótico','💉','far'],hemo:['Kit de cultivos','🧫','lab'],gr:['Paquete globular','🩸','ban']};
const ACCIONES={masaje:'🤲 Masaje uterino',signos:'📟 Control de signos'};
const NOMBRES={R:'María',A:'Lucía',Y:'Carmen'};
const BEDS={b1:{x:60,y:60,r:'Emergencia',room:'emg'},b2:{x:315,y:70,r:'Sala de partos',room:'par'},b3:{x:560,y:340,r:'Referencia',room:'ref'}};
const LV=[{t:'Primera guardia',time:170,p:[['R','b1',0]]},{t:'Segunda guardia',time:170,p:[['A','b1',0]]},{t:'Tercera guardia',time:170,p:[['Y','b1',0]]},{t:'Emergencias simultáneas',time:260,p:[['Y','b2',0],['A','b1',25],['R','b3',50]]}];
const DRAIN={R:.8,A:.55,Y:.4};
/* ================================================ */
const $=i=>document.getElementById(i),cv=$('c'),cx=cv.getContext('2d');
const W=[[0,146,90,8],[130,146,170,8],[340,146,170,8],[550,146,90,8],[0,246,60,8],[100,246,120,8],[260,246,120,8],[420,246,120,8],[580,246,60,8],[206,0,8,146],[416,0,8,146],[156,254,8,166],[316,254,8,166],[476,254,8,166]];
const ROOMS=[[0,0,206,146,'#e3f4f1','EMERGENCIA OBSTÉTRICA'],[214,0,202,146,'#e8f0fb','SALA DE PARTOS'],[424,0,216,146,'#fdeef3','ENFERMERÍA'],[0,254,156,166,'#f1e8f7','LABORATORIO'],[164,254,152,166,'#eaf6e4','FARMACIA'],[324,254,152,166,'#fbe9e7','BANCO DE SANGRE'],[484,254,156,166,'#fff3e0','REFERENCIA']];
const NPC=[{id:'enf',n:'Enfermera Rosa',x:520,y:60,c:'#f06292',team:1},{id:'med',n:'Dra. Vega (obstetra)',x:150,y:115,c:'#1e88e5',team:1},{id:'far',n:'Farmacéutico Leo',x:240,y:330,c:'#7cb342'},{id:'lab',n:'Téc. Marta (laboratorio)',x:80,y:330,c:'#ab47bc'},{id:'ban',n:'Téc. Iván (banco de sangre)',x:400,y:330,c:'#e57373'},{id:'amb',n:'Ramiro (ambulancia)',x:518,y:325,c:'#ffb74d'}];
NPC.forEach(n=>{n.hx=n.x;n.hy=n.y;n.path=[]});
ROOMS.forEach((r,i)=>r.push(['emg','par','enf','lab','far','ban','ref'][i]));
let hov=null;
const CENTRAL={x:320,y:200};
let G,P,keys={},last=0,dlgOpen=false;
let FBK=null,FL=[];function pop(t,c){FL.push({s:t,c:c,x:P.x,y:P.y-34,t0:performance.now()})}
function msg(t,c){FBK={t:t,c:c||'info'};const m=$('msg');m.className=c||'';m.textContent=t;if(c=='bad')SFX.bad();else if(c=='warn')SFX.warn();else if(c=='ok')SFX.ok()}
let AC=null,MUTE=false,amb=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f,d,ty,v,t0,f2){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq,t0){const a=ac();if(!a||MUTE)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();fl.type='lowpass';fl.frequency.value=fq;g.gain.value=v;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(a.currentTime+(t0||0))}
function ambStart(){const a=ac();if(!a||MUTE||amb)return;const g=a.createGain();g.gain.value=.6;g.connect(a.destination);const o1=a.createOscillator(),o2=a.createOscillator(),g1=a.createGain();o1.frequency.value=55;o2.type='triangle';o2.frequency.value=110.6;g1.gain.value=.02;o1.connect(g1);o2.connect(g1);g1.connect(g);
const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g2=a.createGain();s.buffer=b;s.loop=true;fl.type='lowpass';fl.frequency.value=380;g2.gain.value=.03;s.connect(fl);fl.connect(g2);g2.connect(g);o1.start();o2.start();s.start();amb={stop(){try{o1.stop();o2.stop();s.stop();g.disconnect()}catch(e){}}}}
function ambStop(){if(amb){amb.stop();amb=null}}
const SFX={click:()=>tone(520,.05,'square',.04),step:()=>noise(.06,.07,500),door:()=>{noise(.18,.1,300);tone(140,.12,'sine',.08)},
ok:()=>{tone(660,.1,'square',.05);tone(990,.16,'square',.05,.1)},bad:()=>tone(200,.28,'sawtooth',.07,0,90),warn:()=>{tone(880,.1,'square',.05);tone(880,.1,'square',.05,.16)},
take:()=>{tone(700,.06,'triangle',.08);tone(1050,.08,'triangle',.08,.06)},scan:()=>{tone(500,.1,'sine',.08);tone(750,.14,'sine',.08,.1)},
phone:()=>[0,.25,.5].forEach(t=>{tone(1000,.08,'square',.04,t);tone(800,.08,'square',.04,t+.09)}),
key:k=>{const f={R:420,A:560,Y:700}[k];for(let i=0;i<4;i++)tone(i%2?f*1.5:f,.14,'sawtooth',.05,.25+i*.16)},
alarm:()=>[0,.3,.6].forEach(t=>{tone(700,.14,'square',.05,t);tone(520,.14,'square',.05,t+.15)}),
mon:m=>tone(m<30?1250:1000,.05,'sine',m<30?.06:.04),pa:()=>{tone(784,.35,'sine',.03);tone(988,.5,'sine',.03,.3);noise(.4,.01,900,.1)},
heal:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.08,i*.1)),win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.05,i*.14)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.06,i*.2))};
function toggleSnd(){MUTE=!MUTE;$('snd').textContent=MUTE?'🔇':'🔊';if(MUTE)ambStop();else if(G&&G.run)ambStart()}
addEventListener('keydown',e=>{if(e.key=='m'||e.key=='M')toggleSnd()});
document.addEventListener('pointerdown',()=>ac());
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button')&&e.target.id!='snd')SFX.click()});
function dlg(h){dlgOpen=!!h;const d=$('dlg');d.style.display=h?'block':'none';const room=h&&h.includes('📍');d.innerHTML=h?`<div class="th"><span>${room?'📋 FICHA DE ATENCIÓN':'🏥 CLAVES OBSTÉTRICAS'}</span>${room?'<button class="x" onclick="dlg()">✕</button>':''}</div><div class="tb">${h}</div>`:''}
const B=(t,f,c)=>`<button class="${c||''}" onclick="${f}">${t}</button>`;
function home(){ambStop();G={lv:0,lives:3,score:0,run:false};P={x:320,y:200,inv:[],path:[],dest:null,room:null};dlg(`<h3>🏥 Misión: Claves Obstétricas</h3><p>Eres estudiante de Obstetricia en tu primera guardia. Haz clic en las habitaciones para desplazarte por el hospital: <b>observa</b> a cada gestante, <b>activa la clave</b>, reúne materiales, <b>coordina al equipo</b> y estabiliza a la paciente.</p><p class="st">Simulación académica. El protocolo es configurable y el incluido es solo un ejemplo.</p>${B('Comenzar','brief()','p')}`);hud()}
function brief(){const l=LV[G.lv];dlg(`<h3>Nivel ${G.lv+1}: ${l.t}</h3><p>Tiempo: ${l.time}s · Vidas: ${'❤️'.repeat(G.lives)}</p><p class="st">Haz clic en una habitación para caminar hasta ella. Al llegar se abren las acciones disponibles.</p>${B('¡A la guardia!','startLv()','p')}`)}
function startLv(){const l=LV[G.lv];dlg('');G.t=l.time;G.el=0;G.run=true;G.amT=6;G.bT=0;G.sT=0;ambStart();P.x=320;P.y=200;P.inv=[];P.path=[];P.dest=null;P.room=null;
NPC.forEach(n=>{n.x=n.hx;n.y=n.hy;n.path=[]});
G.pts=l.p.map((a,i)=>({id:i,k:a[0],bed:a[1],at:a[2],here:false,obs:false,act:false,step:0,st:70,done:false}));msg('Turno iniciado. Espera una emergencia…');hud()}
function hud(){const T=Math.max(0,Math.ceil(G.t||0));
$('hud').innerHTML=`<span class="hb">NIVEL ${G.lv+1}</span><span class="hb">${[0,1,2].map(i=>i<G.lives?'❤️':'🖤').join('')}</span><span class="hb">⭐ ${String(G.score).padStart(5,'0')}</span><span class="hb tm ${T<30&&G.run?'low':''}">⏱ ${Math.floor(T/60)}:${String(T%60).padStart(2,'0')}</span><span class="hb">🎒 ${[0,1,2].map(i=>`<i class="slot">${P.inv[i]?ITEMS[P.inv[i]][1]:''}</i>`).join('')}</span>`;
$('pb').innerHTML=(G.pts||[]).filter(p=>p.here&&!p.done).map(p=>`<div class="pbx" style="border-color:${p.act?PROTOCOLO[p.k].color:'#8c7fb5'}">🤰 ${NOMBRES[p.k]} · ${BEDS[p.bed].r}<div class="bar"><i style="width:${Math.max(0,p.st)}%;background:${p.st<30?'#e53935':p.st<55?'#fb8c00':'#43a047'}"></i></div></div>`).join('')}
function present(p){const b=BEDS[p.bed];return NPC.filter(n=>n.team).every(n=>Math.hypot(n.x-b.x,n.y-b.y)<50)}
const DR={emg:[110,130],par:[320,130],enf:[530,130],lab:[80,270],far:[240,270],ban:[400,270],ref:[560,270]};
const STAND={emg:[110,100],par:[320,115],enf:[480,100],lab:[80,300],far:[240,300],ban:[400,300],ref:[590,300]};
const RN={emg:'Emergencia obstétrica',par:'Sala de partos',enf:'Enfermería',lab:'Laboratorio',far:'Farmacia',ban:'Banco de sangre',ref:'Área de referencia'};
function zone(x,y){return y<146?(x<206?'emg':x<416?'par':'enf'):y>254?(x<156?'lab':x<316?'far':x<476?'ban':'ref'):'cor'}
function route(x,y,tx,ty){const a=zone(x,y),b=zone(tx,ty),p=[];if(a!=b){if(a!='cor')p.push([DR[a][0],DR[a][1]],[DR[a][0],200]);if(b!='cor')p.push([DR[b][0],200],[DR[b][0],DR[b][1]])}p.push([tx,ty]);return p}
function walk(o,path,dt,sp){if(!path.length)return;const t=path[0],d=Math.hypot(t[0]-o.x,t[1]-o.y),s=sp*dt;if(d<=s){o.x=t[0];o.y=t[1];path.shift()}else{o.x+=(t[0]-o.x)/d*s;o.y+=(t[1]-o.y)/d*s}}
function update(dt){if(!G.run||dlgOpen)return;
if(P.path.length){walk(P,P.path,dt,140);if(!P.path.length&&P.dest){P.room=P.dest;P.dest=null;SFX.door();msg('📍 Llegaste a '+RN[P.room]);panel(P.room)}}
NPC.forEach(n=>walk(n,n.path,dt,70));
if(P.path.length){G.sT-=dt;if(G.sT<=0){SFX.step();G.sT=.27}}
G.amT-=dt;if(G.amT<=0){SFX.pa();G.amT=9+Math.random()*8}
const pv=G.pts.filter(p=>p.here&&!p.done);if(pv.length){const mn=Math.min(...pv.map(p=>p.st));G.bT-=dt;if(G.bT<=0){SFX.mon(mn);G.bT=mn<30?.5:mn<55?.9:1.4}}
G.el+=dt;G.t-=dt;let fail=null;
G.pts.forEach(p=>{if(!p.here&&G.el>=p.at){p.here=true;SFX.alarm();msg('🚨 ¡Llega una gestante a '+BEDS[p.bed].r+'! Dirígete a esa habitación.','warn')}
if(p.here&&!p.done){p.st-=DRAIN[p.k]*dt*(present(p)?.5:1)*(1+G.lv*.06);if(p.st<=0)fail='La paciente se descompensó gravemente.'}});
if(G.t<=0)fail='Se agotó el tiempo.';if(fail)return lose(fail);hud()}
function lose(r){G.run=false;G.lives--;G.score=Math.max(0,G.score-100);SFX.lose();ambStop();hud();
dlg(G.lives<=0?`<h3>💀 Fin del juego</h3><p>${r}</p><p>Puntaje: ⭐ ${G.score}</p>${B('Reiniciar','home()','p')}`:`<h3>❌ Misión fallida</h3><p>${r}</p><p>Vidas: ${'❤️'.repeat(G.lives)}</p>${B('Reintentar nivel','brief()','p')}`)}
